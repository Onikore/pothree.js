# Build + size budget + the reference test suite (SwiftShader, see docs/testing.md) on every push.
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and build
        run: npm ci   # postinstall runs npm run build

      - name: Size budget
        run: node tests/size.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # the baselines were recorded with these fonts (Microsoft core fonts + Noto); other fonts
      # change text rendering in sidebars and example pages by 0.5-1.3 %
      - name: Install fonts
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get install -y --no-install-recommends ttf-mscorefonts-installer fonts-noto-core fonts-noto-cjk
          fc-match serif; fc-match sans-serif; fc-match Arial

      # point clouds of examples that load from the Potree demo server (tests/remoteCache.mjs);
      # saved even when a test fails, so the next run does not download them again
      - name: Restore remote data cache
        uses: actions/cache/restore@v4
        with:
          path: tests/.cache
          key: remote-data-v1-${{ github.run_id }}
          restore-keys: remote-data-v1-

      # 2 pages at a time: SwiftShader uses several cores per page, the runner has 4 slow ones
      - name: Visual regression (SwiftShader)
        run: node tests/visual/run.mjs --jobs 2
        env:
          VISUAL_TIMEOUT_MS: 600000

      - name: Picking
        run: node tests/visual/pick.mjs

      - name: Operations
        run: node tests/visual/operations.mjs

      - name: Render on demand
        run: node tests/visual/ondemand.mjs

      - name: Save remote data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tests/.cache
          key: remote-data-v1-${{ github.run_id }}

      - name: Upload screenshots and diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-output
          path: tests/visual/output
          retention-days: 7
